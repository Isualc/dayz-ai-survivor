name: Traffic archivieren

# GitHub löscht Traffic-Daten nach 14 Tagen. Dieser Job holt sie täglich ab
# und committet sie nach docs/traffic/, damit eine Gesamtstatistik entsteht.

on:
  schedule:
    - cron: '17 4 * * *'   # täglich 04:17 UTC
  workflow_dispatch:        # manuell auslösbar im Actions-Tab

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Traffic abholen und mergen
        env:
          # GITHUB_TOKEN reicht NICHT (Traffic-API braucht Administration-Recht,
          # das der Actions-Token nie bekommt, daher 403). Pflicht: fein granulierter
          # PAT nur für dieses Repo mit "Administration: Read-only" als Secret
          # TRAFFIC_TOKEN. Läuft der PAT ab, kommt wieder 403.
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/traffic_archive.py

      - name: Committen, falls sich etwas geändert hat
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/traffic
          git diff --staged --quiet || git commit -m "chore(traffic): Statistik vom $(date -u +%F)"
          git push
